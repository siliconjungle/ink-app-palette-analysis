[extend]
useDefault = true

[[allowlists]]
description = "Exact source checksums in dependency provenance metadata"
condition = "AND"
paths = ["(?i)(?:SDK-PROVENANCE|sdk-(?:source|interop-source|clipboard-source)|sdk\\.lock|vendor-lock|source-provenance)\\.json$"]
regexTarget = "secret"
regexes = ['^[a-f0-9]{40}$', '^[a-f0-9]{64}$']
